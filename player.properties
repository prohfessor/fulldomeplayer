# Paths may be changed without recompiling.
media.root=E:\\www
playlist.root=E:\\www\\player
player.url=http://localhost/player/index.html?playlist=test.js

# JCEF remote debugging. Set to 0 to disable when supported by the bundled JCEF.
chromium.remoteDebuggingPort=8081

# screenIndex=-1 selects the first screen at least minimumWidth pixels wide.
dome.screenIndex=-1
dome.minimumWidth=3000

# Executable name or absolute path.
ffprobe.path=ffprobe
